[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "yt-dlp-nicocomments"
dynamic = ["version"]
description = "yt-dlp plugin that converts Niconico comments to ASS subtitles"
readme = "README.md"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Hiroki Okada", email = "hiroki@hiroki.io" }]
requires-python = ">=3.10"
keywords = ["ass", "danmaku", "niconico", "nicovideo", "subtitles", "yt-dlp", "yt-dlp-plugins"]
classifiers = [
    "Environment :: Console",
    "Environment :: Plugins",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = ["fonttools>=4.65.0"]

[project.urls]
Homepage = "https://github.com/hiroki-io/yt-dlp-nicocomments"
Issues = "https://github.com/hiroki-io/yt-dlp-nicocomments/issues"
Releases = "https://github.com/hiroki-io/yt-dlp-nicocomments/releases"

[dependency-groups]
dev = ["pillow", "pyright", "pytest", "ruff", "yt-dlp"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = ["/yt_dlp_plugins", "/tests", "/tools/drift/official.json", "/tools/font_data.py", "/hatch_build.py"]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["yt_dlp_plugins"]

[tool.uv]
cache-keys = [
    { git = { commit = true, tags = true } },
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "tools/font_data.py" },
    { file = "yt_dlp_plugins/postprocessor/_nicocomments/font_files.py" },
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["yt_dlp_plugins", "tests", "tools", "hatch_build.py"]
extraPaths = ["tests"]
pythonVersion = "3.10"
reportUnnecessaryTypeIgnoreComment = "error"
