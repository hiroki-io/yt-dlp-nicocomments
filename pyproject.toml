[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-dlp-nicocomments"
version = "0.1.0"
description = "yt-dlp plugin that converts Niconico comments to ASS subtitles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hiroki Okada", email = "hiroki@hiroki.io" }]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pillow", "pytest", "ruff", "yt-dlp"]

[tool.hatch.build.targets.wheel]
packages = ["yt_dlp_plugins"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
