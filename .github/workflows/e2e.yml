name: End-to-end

on:
  push:
    branches: [main]
    paths:
      - yt_dlp_plugins/**
      - tools/e2e.py
      - tools/font_data.py
      - hatch_build.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/e2e.yml
  pull_request:
    paths:
      - yt_dlp_plugins/**
      - tools/e2e.py
      - tools/font_data.py
      - hatch_build.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/e2e.yml
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    name: Download and check the subtitle track on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: yt_dlp_plugins/postprocessor/_nicocomments/font_data
          key: fonts-${{ hashFiles('yt_dlp_plugins/postprocessor/_nicocomments/font_files.py') }}
      - name: Run yt-dlp with placeholder media
        run: |
          uv run --locked python tools/e2e.py --embed-subs --use-postprocessor "NicoComments:when=video" -o "video.%(ext)s" https://www.nicovideo.jp/watch/sm9
      # FFprobe on Windows can end lines with CRLF.
      - name: Check the comment subtitle track
        run: |
          ffprobe -v error -select_streams s -show_entries stream=codec_name:stream_disposition=default \
            -of csv=p=0 video.mkv | tr -d '\r' | tee streams.txt
          grep -qx "ass,1" streams.txt
      - name: Check the font attachments
        run: |
          ffprobe -v error -select_streams t -show_entries stream_tags=filename -of csv=p=0 video.mkv \
            | tr -d '\r' | tee fonts.txt
          grep -qx "NotoSansJP-Bold.otf" fonts.txt
          ffprobe -v error -select_streams t -show_entries stream_tags=mimetype -of csv=p=0 video.mkv \
            | tr -d '\r' | tee mimetypes.txt
          grep -qx "application/vnd.ms-opentype" mimetypes.txt
