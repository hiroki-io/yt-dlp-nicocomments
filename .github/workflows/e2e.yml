name: End-to-end

on:
  push:
    branches: [main]
    paths:
      - yt_dlp_plugins/**
      - tools/e2e.py
      - tools/font_data.py
      - hatch_build.py
      - build-requirements.txt
      - pyproject.toml
      - uv.lock
      - .github/workflows/e2e.yml
  pull_request:
    paths:
      - yt_dlp_plugins/**
      - tools/e2e.py
      - tools/font_data.py
      - hatch_build.py
      - build-requirements.txt
      - pyproject.toml
      - uv.lock
      - .github/workflows/e2e.yml
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  download:
    name: Download on ${{ matrix.os }} / yt-dlp ${{ matrix.yt-dlp }} / ${{ matrix.install }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        yt-dlp: [locked]
        install: [wheel]
        include:
          - os: ubuntu-latest
            yt-dlp: stable
            install: wheel
            uv-options: --upgrade-package yt-dlp
          - os: ubuntu-latest
            yt-dlp: nightly
            install: wheel
            uv-options: --upgrade-package yt-dlp --prerelease allow
          # The yt-dlp executable loads the wheel from a plugin directory and has no fontTools.
          - os: ubuntu-latest
            yt-dlp: locked
            install: plugin-dir
          - os: windows-latest
            yt-dlp: locked
            install: plugin-dir
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # choco exits with 0 when it cannot reach the package feed.
          foreach ($attempt in 1..5) {
            choco install ffmpeg -y --no-progress
            if ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue)) { exit 0 }
            if ($attempt -lt 5) { Start-Sleep -Seconds (30 * $attempt) }
          }
          throw "Failed to install FFmpeg with Chocolatey"
      - name: Check FFmpeg
        run: ffmpeg -version && ffprobe -version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: yt_dlp_plugins/postprocessor/_nicocomments/font_data
          key: fonts-${{ hashFiles('yt_dlp_plugins/postprocessor/_nicocomments/font_files.py') }}
      # Build the wheel from the sdist like the Release workflow, so that the job also tests the sdist.
      - run: uv build --build-constraint build-requirements.txt --require-hashes
      - name: Install yt-dlp and the wheel
        if: matrix.install == 'wheel'
        env:
          UV_OPTIONS: ${{ matrix.uv-options || '--locked' }}
        run: |
          read -ra uv_options <<< "$UV_OPTIONS"
          uv sync "${uv_options[@]}" --no-install-project
          uv pip install dist/*.whl
      - name: Install yt-dlp and put the wheel in a plugin directory
        if: matrix.install == 'plugin-dir'
        run: |
          uv sync --locked --only-dev
          if uv run --no-sync python -c "import fontTools" 2> /dev/null; then
            echo "::error::fontTools is installed"
            exit 1
          fi
          if uv run --no-sync which pyftsubset; then
            echo "::error::pyftsubset is on PATH"
            exit 1
          fi
          mkdir plugins
          cp dist/*.whl plugins/
          echo "PLUGIN_OPTIONS=--no-plugin-dirs --plugin-dirs plugins" >> "$GITHUB_ENV"
      - name: Run yt-dlp with placeholder media
        env:
          E2E_INSTALLED_PLUGIN: "1"
        run: |
          read -ra plugin_options <<< "${PLUGIN_OPTIONS:-}"
          uv run --no-sync python -c "import yt_dlp.version as v; print(f'yt-dlp {v.__version__}')"
          uv run --no-sync python tools/e2e.py "${plugin_options[@]}" --embed-subs --use-postprocessor "NicoComments:when=video" -o "video.%(ext)s" https://www.nicovideo.jp/watch/sm9
      # FFprobe on Windows can end lines with CRLF.
      - name: Check the comment subtitle track
        run: |
          ffprobe -v error -select_streams s -show_entries stream=codec_name:stream_disposition=default \
            -of csv=p=0 video.mkv | tr -d '\r' | tee streams.txt
          grep -qx "ass,1" streams.txt
      - name: Check the font attachments
        run: |
          ffprobe -v error -select_streams t -show_entries stream_tags=filename -of csv=p=0 video.mkv \
            | tr -d '\r' | tee fonts.txt
          grep -qx "NotoSansJP-Bold.otf" fonts.txt
          ffprobe -v error -select_streams t -show_entries stream_tags=mimetype -of csv=p=0 video.mkv \
            | tr -d '\r' | tee mimetypes.txt
          grep -qx "application/vnd.ms-opentype" mimetypes.txt
