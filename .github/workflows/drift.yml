name: Drift

on:
  push:
    branches: [main]
    paths:
      - tools/drift/**
      - yt_dlp_plugins/postprocessor/_nicocomments/api.py
      - .github/workflows/drift.yml
  pull_request:
    paths:
      - tools/drift/**
      - yt_dlp_plugins/postprocessor/_nicocomments/api.py
      - .github/workflows/drift.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Check the comment API schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.10"
      - run: uv run --locked python tools/drift/api.py

  player:
    name: Check the official player code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/drift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node player.mts check
